name: Auto Ground-Truth YouTube Capture & Validation

# ⚠️ 安全性：本 repo 為 PUBLIC，且本 workflow 在自架 runner (你的個人電腦)
# 上執行。絕對不要為本 workflow 加上 pull_request 觸發 —— 任何人 fork 後開 PR
# 就能在你的機器上執行任意程式碼。目前僅有 schedule 與 workflow_dispatch，
# 後者需要 repo 寫入權限，外部人士無法觸發。
#
# 2026-09-12：擷取管線已從「出景當刻單張精準擷取」改成「T-40~T+40 縮時
# 多影格 (9 張)，聚合出平均分+峰值分」(見 scripts/capture_timelapse_multi_
# station.py)，取代原本分開的 auto_timelapse_multi_station.yml —— 兩者
# 本來就在抓幾乎同一時段的畫面，合併後不必重複打兩次 YouTube/ffmpeg。
on:
  # 原本用 schedule cron 觸發 (05:30/09:00/18:45/21:00 台灣時間)，但
  # GitHub Actions 排程實測延遲 4-7 小時，擷取常常完全錯過出景窗口。
  # 已改為本機 Windows 工作排程器在準時的本機時鐘上呼叫
  # `gh workflow run` 觸發下面的 workflow_dispatch，見
  # scripts/install-local-scheduler.ps1。
  workflow_dispatch:
    inputs:
      session:
        description: '驗證時段 (sunset 或 sunrise)'
        required: true
        default: 'sunset'
        type: choice
        options:
          - sunset
          - sunrise

permissions:
  contents: write

jobs:
  capture-and-record:
    # 縮時多影格擷取需要住宅 IP 才能穩定通過 YouTube bot check、用 DVR sq
    # 回溯 9 個不同時間點 —— 沒有 Tier B 海報降級可退（那是舊版單張擷取
    # 才有的機制），GitHub 託管 runner 上這個 job 基本上就是全數擷取失敗。
    # 設定 repo variable CAPTURE_RUNNER 可覆寫回 'ubuntu-latest' 供臨時除錯用。
    runs-on: ${{ vars.CAPTURE_RUNNER || 'self-hosted' }}
    timeout-minutes: 30
    defaults:
      run:
        # 自架 Windows runner 預設為 pwsh，明確指定 bash 讓兩種平台共用同一份語法
        # (Windows 上由 Git for Windows 提供的 Git Bash 執行)
        shell: bash
    env:
      TZ: Asia/Taipei
      # 縮時原始影格 (9 張/站) 寫到 checkout 目錄「之外」—— 放在 workspace
      # 內的話，下一個在同一台自架 runner 上跑的 workflow 其 actions/checkout
      # `git clean -ffdx` 會清掉。只有聚合出的平均分/峰值分 (data/verification-
      # records.json) 進 git，原始影格本身從不進 git。與 taipei-skyfire
      # checkout 平行放在 D:\working space\ 底下方便直接找到（不是放進
      # checkout 裡面 —— 那樣一樣會被下一次 git clean 清掉）。
      SKYFIRE_TIMELAPSE_DIR: "D:/working space/skyfire-timelapse"

    steps:
      - name: 📥 檢出程式碼庫 (Checkout)
        uses: actions/checkout@v5

      # 自架 Windows runner (NETWORK SERVICE 服務帳號) 的 PATH 只有 Git\cmd，
      # 沒有 Git\bin，導致 runner 解析 shell: bash 時 which('bash') 失敗、
      # 所有 run 步驟開場即 `bash: command not found`。用 cmd (不受 PowerShell
      # 執行原則限制，該機器為 Restricted) 把 Git\bin 寫進 $GITHUB_PATH，
      # 供後續步驟的 shell 解析使用。echo 前後不留空白以免混入路徑。
      - name: 🔧 補上 Git Bash 路徑 (自架 Windows runner)
        if: runner.os == 'Windows'
        shell: cmd
        run: echo C:\Program Files\Git\bin>>"%GITHUB_PATH%"

      - name: ⚙️ 設定 Node.js 環境
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: 🧪 執行擷取與預測單元測試
        run: node tests/run-all-tests.js

      # 與本檔其他步驟一致：測試掛掉不連坐整條日報管線 (見下方 2026-08-18 註解)。
      - name: 🐍 執行日報產生器、校準守門、縮時聚合測試
        continue-on-error: true
        run: |
          if command -v python3 >/dev/null 2>&1; then PY=python3
          elif command -v python >/dev/null 2>&1; then PY=python
          else echo "::warning::找不到 python，跳過 Python 測試"; exit 0; fi
          "$PY" tests/test_daily_briefing.py || echo "::warning::日報產生器／校準守門測試未通過"
          "$PY" tests/test_timelapse_aggregation.py || echo "::warning::縮時聚合 (平均分/峰值分) 測試未通過"

      - name: 🌅 解析本次天文驗證時段
        id: session
        env:
          MANUAL_SESSION: ${{ inputs.session }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          SESSION="$(node -e "const { resolveSessionType } = require('./scripts/live-capture-core.js'); process.stdout.write(resolveSessionType(process.env.MANUAL_SESSION, process.env.EVENT_SCHEDULE));")"
          echo "value=$SESSION" >> "$GITHUB_OUTPUT"
          echo "Resolved capture session: $SESSION"

      - name: 🛠️ 安裝相依工具 (GitHub 託管 Linux runner)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip
          pip3 install --break-system-packages yt-dlp pillow numpy

      - name: 🔍 檢查自架 runner 相依工具
        if: runner.os != 'Linux'
        run: |
          # 自架 runner 上不自動安裝套件，只回報缺什麼。
          # 缺工具不讓 job 失敗：擷取會自動降級，日報照常產出。
          MISSING=""
          for tool in ffmpeg ffprobe yt-dlp; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "✅ $tool: $($tool -version 2>&1 | head -1 || $tool --version 2>&1 | head -1)"
            else
              echo "❌ $tool 未安裝"
              MISSING="$MISSING $tool"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::warning::自架 runner 缺少工具:$MISSING —— 縮時擷取無法使用，該場次會全數記為 capture_unavailable"
          fi

      - name: 🐍 解析 Python 執行檔與影像分析套件
        run: |
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          echo "PYTHON_BIN=$PY" >> "$GITHUB_ENV"
          echo "使用 $PY: $($PY --version 2>&1)"
          "$PY" -c "import PIL, numpy; print('pillow', PIL.__version__, '/ numpy', numpy.__version__)" \
            || echo "::warning::缺少 pillow 或 numpy，光學色彩分析將無法執行 (pip install pillow numpy)"

      # secrets context 不可用於 step-level if，故以 env 判斷是否已設定
      - name: 🍪 寫入 YouTube cookies (若已設定 secret)
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then
            printf '%s' "$YT_COOKIES" > "$RUNNER_TEMP/yt-cookies.txt"
            echo "YT_COOKIES_FILE=$RUNNER_TEMP/yt-cookies.txt" >> "$GITHUB_ENV"
            echo "已載入 YouTube cookies"
          else
            echo "未設定 YT_COOKIES secret (自架 runner 使用住宅 IP 時通常不需要)"
          fi

      # T-40 ~ T+40、每 10 分鐘一張 (9 張)，DVR 回溯一次抓完，不必即時等待。
      # 每站聚合出「平均分」(全段 80 分鐘) + 「峰值分」(日出前/日落後那一側
      # 的最高分) 兩個獨立實測數字，直接寫進 data/verification-records.json
      # (script 內部完成，不需再跑一支獨立的評分腳本)。
      # 以下步驟一律執行：擷取若失敗，仍須產出每日日報 (2026-08-18 起排程
      # 連續 33 次全紅，就是因為擷取步驟一失敗，後面全被連坐跳過)。
      - name: 🎞️ 執行多機位縮時擷取與光學評分 (T-40~T+40，平均分+峰值分)
        id: timelapse
        continue-on-error: true
        run: "$PYTHON_BIN scripts/capture_timelapse_multi_station.py \"${{ steps.session.outputs.value }}\""

      - name: 📦 複製縮時產出到 workspace 供上傳
        id: stage
        if: always() && steps.timelapse.outputs.bundle_dir != ''
        run: |
          STAGE="$GITHUB_WORKSPACE/_timelapse_artifact"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp -r "${{ steps.timelapse.outputs.bundle_dir }}/." "$STAGE/"
          echo "dir=$STAGE" >> "$GITHUB_OUTPUT"

      - name: ☁️ 上傳縮時產出為 workflow artifact
        if: always() && steps.stage.outputs.dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: timelapse-${{ steps.session.outputs.value }}-${{ github.run_id }}
          path: ${{ steps.stage.outputs.dir }}
          if-no-files-found: warn
          retention-days: 14

      - name: 📰 產生每日實況驗證日報與歷史歸檔 (Daily Ground Truth Briefing)
        if: always()
        run: |
          "$PYTHON_BIN" scripts/generate_daily_briefing.py "${{ steps.session.outputs.value }}"

      - name: 🗂️ 更新今晚各機位排名
        if: always()
        run: node scripts/build-tonight-stations.js "${{ steps.session.outputs.value }}"

      - name: 🚀 提交驗證數據至倉庫 (Commit & Push)
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action [SkyFire Bot]"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(validation): record live sky snapshot and prediction [skip ci]" && git push)
