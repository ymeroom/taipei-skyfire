name: Auto Ground-Truth YouTube Capture & Validation

on:
  schedule:
    # 每日清晨日出日報發布 (台灣時間 09:00 = UTC 01:00)
    - cron: '0 1 * * *'
    # 每日傍晚日落日報發布 (台灣時間 21:00 = UTC 13:00)
    - cron: '0 13 * * *'
    # 每日日落出景當刻擷取 (台灣時間 18:45 = UTC 10:45)
    - cron: '45 10 * * *'
    # 每日日出出景當刻擷取 (台灣時間 05:30 = UTC 21:30)
    - cron: '30 21 * * *'
  # 支援手動在 GitHub Actions 頁面一鍵觸發測試
  workflow_dispatch:
    inputs:
      session:
        description: '驗證時段 (sunset 或 sunrise)'
        required: true
        default: 'sunset'
        type: choice
        options:
          - sunset
          - sunrise

permissions:
  contents: write

jobs:
  capture-and-record:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Taipei

    steps:
      - name: 📥 檢出程式碼庫 (Checkout)
        uses: actions/checkout@v4

      - name: ⚙️ 設定 Node.js 環境
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🧪 執行擷取與預測單元測試
        run: node tests/run-all-tests.js

      - name: 🌅 解析本次天文驗證時段
        id: session
        env:
          MANUAL_SESSION: ${{ inputs.session }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          SESSION="$(node -e "const { resolveSessionType } = require('./scripts/live-capture-core.js'); process.stdout.write(resolveSessionType(process.env.MANUAL_SESSION, process.env.EVENT_SCHEDULE));")"
          echo "value=$SESSION" >> "$GITHUB_OUTPUT"
          echo "Resolved capture session: $SESSION"

      - name: 🛠️ 安裝 ffmpeg, yt-dlp 與 Python 影像光學分析套件
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip
          pip3 install --break-system-packages yt-dlp pillow numpy

      - name: 📸 執行出景窗口即時影格擷取與預測記錄 (Phase 1)
        run: node scripts/capture-validation.js "${{ steps.session.outputs.value }}"

      - name: 🎬 執行 50 分鐘 11 連續縮時影格擷取 (前後 25 分鐘 / 每 5 分鐘 1 次)
        run: python3 scripts/capture_timelapse_series.py "${{ steps.session.outputs.value }}"

      - name: 🔬 執行天空色彩光學直方圖分析與模型誤差檢驗 (Phase 2)
        run: node scripts/score-ground-truth.js "${{ steps.session.outputs.value }}"

      - name: 📰 產生每日實況驗證日報與歷史歸檔 (Daily Ground Truth Briefing)
        run: python3 scripts/generate_daily_briefing.py "${{ steps.session.outputs.value }}"

      - name: 🚀 提交驗證數據至倉庫 (Commit & Push)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action [SkyFire Bot]"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(validation): record live sky snapshot and prediction [skip ci]" && git push)
