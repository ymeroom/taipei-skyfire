name: Weekly Autonomous Model Calibration Loop

on:
  # 原本用 schedule cron 觸發，但 GitHub Actions 排程實測不準時 (見
  # lock_forecast.yml / auto_validate_capture.yml 內同樣的說明)。校準
  # 本身對「準時」沒那麼敏感 (晚幾小時跑不影響正確性)，但為了跟其他
  # workflow 一致、且不再依賴 GitHub 排程本身，一併改為本機 Windows
  # 工作排程器每週觸發，見 scripts/install-local-scheduler.ps1。
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-calibrate:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 檢出程式碼庫 (Checkout)
        uses: actions/checkout@v5

      - name: ⚙️ 設定 Python 環境
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 🧪 執行校準守門、日報產生器、縮時聚合測試
        run: |
          python3 tests/test_daily_briefing.py
          python3 tests/test_timelapse_aggregation.py

      - name: 🤖 執行物理模型損失函數最佳化與參數微調 (Phase 4)
        run: |
          python3 scripts/auto-calibrate-model.py

      - name: 🚀 提交最新校準權重至倉庫 (Commit & Push)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action [SkyFire Calibration Bot]"
          git add data/model-calibration-params.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(model): auto-calibrated physics weights from empirical observations [skip ci]" && git push)
