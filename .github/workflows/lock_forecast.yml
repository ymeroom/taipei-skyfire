name: Lock Forecast Prediction

on:
  # 原本用 schedule cron 觸發，但 GitHub Actions 排程實測會延遲數小時
  # (見 auto_validate_capture.yml 內註解)，對「鎖定」這種要求準時的
  # 動作是致命傷 —— 遲到的鎖定等於事後才做的假預測。
  # 已改為本機 Windows 工作排程器在準時的本機時鐘上呼叫
  # `gh workflow run` 觸發下面的 workflow_dispatch，見
  # scripts/install-local-scheduler.ps1。
  workflow_dispatch:
    inputs:
      session:
        description: '鎖定的時段 (sunset 或 sunrise)'
        required: true
        default: 'sunset'
        type: choice
        options:
          - sunset
          - sunrise

permissions:
  contents: write

jobs:
  lock-forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Taipei

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Run Lock Forecast Script
        env:
          MANUAL_SESSION: ${{ inputs.session }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: node scripts/lock-forecast.js

      - name: 🗂️ 產生今晚各機位排名
        run: node scripts/build-tonight-stations.js

      - name: Commit & Push Locked Forecast
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action [SkyFire Bot]"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(forecast): lock prediction score in advance [skip ci]" && git push)
